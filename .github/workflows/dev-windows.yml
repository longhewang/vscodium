name: Dev - Windows installers

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      APP_NAME: VSCodium
      BINARY_NAME: codium
      ORG_NAME: ${{ github.repository_owner }}
      GH_REPO_PATH: ${{ github.repository }}
      ASSETS_REPOSITORY: ${{ github.repository }}
      CI_BUILD: "no"
      OS_NAME: windows
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable
      SHOULD_BUILD: "yes"
      SHOULD_BUILD_REH: "no"
      SHOULD_BUILD_REH_WEB: "no"
      SHOULD_BUILD_MSI: "yes"
      SHOULD_BUILD_MSI_NOUP: "no"
      SHOULD_BUILD_ZIP: "no"
      SHOULD_BUILD_EXE_SYS: "no"
      SHOULD_BUILD_EXE_USR: "no"
      MSI_CULTURE: zh-cn
      MSI_SKIP_TRANSLATIONS: "yes"
      npm_config_arch: x64
      npm_config_target_arch: x64
      npm_config_python: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify build tools
        run: |
          node --version
          python --version
          jq --version
          rustup --version
          cargo --version
          7z.exe i

      - name: Locate WiX v3 tools
        shell: pwsh
        run: |
          $wixRoot = $env:WIX
          if (-not $wixRoot -or -not (Test-Path (Join-Path $wixRoot "bin\candle.exe"))) {
            $wixRoot = (Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName "bin\candle.exe") } |
              Select-Object -First 1).FullName
          }
          if (-not $wixRoot) { throw "WiX v3 is required on the Windows runner" }
          $wixRoot = $wixRoot.TrimEnd("\") + "\"
          foreach ($tool in "heat.exe", "candle.exe", "light.exe") {
            if (-not (Test-Path (Join-Path $wixRoot "bin\$tool"))) { throw "Missing WiX tool: $tool" }
          }
          "WIX=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch pinned VS Code source
        run: ./get_repo.sh

      - name: Verify RT menu patch and behavior
        run: |
          git -C vscode apply ../patches/80-rt-menubar.patch
          node dev/test_rt_menu_patch.cjs vscode
          git -C vscode apply -R ../patches/80-rt-menubar.patch

      - name: Build application and CLI
        run: ./build.sh

      - name: Package Chinese MSI installer
        env:
          SHOULD_BUILD_CLI: "no"
        run: ./prepare_assets.sh

      - name: Generate checksums
        run: ./prepare_checksums.sh

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-msi
          path: |
            assets/*.msi
            assets/*.msi.sha256
            assets/*.msi.sha1
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
